[project]
name = "hermes-relatedb"
version = "0.1.0"
description = "Hermes memory provider backed by RelateDB"
readme = "README.md"
authors = [
    { email = "lo@heander.se" }
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    "relate-db>=1.0.1",
    "model2vec>=0.3",
]

[project.entry-points."hermes_agent.memory_providers"]
relatedb-memory = "relatedb_memory:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["relatedb_memory"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-bdd>=9.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "pending_4: acceptance scenario awaiting the store engine (#4); strict xfail",
]
